[package]
name = "pi-async-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "单线程串行及并发异步运行时的静态组合"

[features]
default = []
observe = ["pi-async-executor/observe", "pi-async-runtime-core/observe"]

[dependencies]
pi_result.workspace = true
pi-clock-manual.workspace = true
pi-async-task.workspace = true
pi-async-task-queue = { workspace = true, features = ["cancel-timer"] }
pi-async-runtime-core.workspace = true
pi-async-executor.workspace = true
