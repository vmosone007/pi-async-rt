[package]
name = "pi-async-executor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "默认执行器的统一时钟与线程通知基础"

[features]
default = []
observe = ["pi-async-runtime-core/observe"]

[dependencies]
pi_result.workspace = true
pi-clock-manual.workspace = true
pi-async-runtime-core.workspace = true
pi-async-task-queue = { workspace = true, features = ["cancel-timer"] }
cordyceps.workspace = true
pi-async-task.workspace = true
pi-async-task-wake = { path = "../task-wake", version = "0.1", default-features = false }
