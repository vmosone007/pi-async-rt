[package]
name = "pi-async-rt-metrics-otlp-fixture"
version = "0.0.0"
edition = "2018"
publish = false
autotests = false

# 独立测试装配，不改变根库的依赖、锁文件或默认测试入口。
[workspace]

[dev-dependencies]
pi-async-rt = { path = "../../..", version = "=0.5.13", features = ["trace"] }
opentelemetry = { version = "=0.30.0", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "=0.30.0", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "=0.30.0", default-features = false, features = ["grpc-tonic", "metrics"] }
opentelemetry-proto = { version = "=0.30.0", default-features = false, features = ["gen-tonic", "metrics"] }
tonic = { version = "=0.13.1", default-features = false, features = ["server"] }
tokio = { version = "=1.50.0", default-features = false, features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "=0.1.19", default-features = false, features = ["net"] }

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
