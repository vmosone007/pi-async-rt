[package]
name = "pi-async-rt-metrics-bench-fixture"
version = "0.0.0"
edition = "2018"
publish = false
autotests = false
autobenches = false

# 独立有界测量装配，不改变根依赖或原OTLP验收夹具。
[workspace]

[dev-dependencies]
pi-async-rt = { path = "../../..", version = "=0.5.13", features = ["trace"] }
opentelemetry = { version = "=0.30.0", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "=0.30.0", default-features = false, features = ["metrics"] }
opentelemetry-proto = { version = "=0.30.0", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = "=0.13.5"
polling = "=3.11.0"

[[bench]]
name = "metrics"
path = "benches/metrics.rs"
harness = false
