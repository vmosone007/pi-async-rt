[workspace]
members = ["crates/task", "crates/task-queue", "crates/task-wake", "crates/wait", "crates/runtime-core"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["vmos <vmosone007@gmail.com>"]

[workspace.dependencies]
atomic-waker = "1.1"
cordyceps = "0.3"
intrusive-collections = "0.10"
indexmap = "2.14"
parking_lot = "0.13"
pi_cancel_timer = "0.7"
pi_slot_wheel = "0.7"
pi_result = "0.2"
pi-clock-manual = { version = "0.1", path = "../pi-clock/crates/manual", default-features = false }
pi-async-task = { path = "crates/task", version = "0.1" }
pi-async-task-queue = { path = "crates/task-queue", version = "0.1", default-features = false }
pi-async-wait = { path = "crates/wait", version = "0.1" }
pi-async-runtime-core = { path = "crates/runtime-core", version = "0.1", default-features = false }
